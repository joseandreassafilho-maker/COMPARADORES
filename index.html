<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores de Comparação</title>
    <style>
        .linha {
            margin: 2px 10px;
        }
        .linha span {
            display: inline-block;
            width: 30px;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="linha">
        <input type="text" id="a1">
        <span>==</span>
        <input type="text" id="b1">
        <button onclick="comparar('==', 'a1', 'b1')">Comparar</button>
    </div>

    <div class="linha">
        <input type="text" id="a2">
        <span>!=</span>
        <input type="text" id="b2">
        <button onclick="comparar('!=', 'a2', 'b2')">Comparar</button>
    </div>

    <div class="linha">
        <input type="text" id="a3">
        <span>&gt;</span>
        <input type="text" id="b3">
        <button onclick="comparar('>', 'a3', 'b3')">Comparar</button>
    </div>

    <div class="linha">
        <input type="text" id="a4">
        <span>&gt;=</span>
        <input type="text" id="b4">
        <button onclick="comparar('>=', 'a4', 'b4')">Comparar</button>
    </div>

    <div class="linha">
        <input type="text" id="a5">
        <span>&lt;</span>
        <input type="text" id="b5">
        <button onclick="comparar('<', 'a5', 'b5')">Comparar</button>
    </div>

    <div class="linha">
        <input type="text" id="a6">
        <span>&lt;=</span>
        <input type="text" id="b6">
        <button onclick="comparar('<=', 'a6', 'b6')">Comparar</button>
    </div>

    <script>
        function converter(texto) {
            var t = texto.trim();
            if (t !== '' && !isNaN(t)) {
                return Number(t);
            }
            return t;
        }

        function comparar(operador, idA, idB) {
            var a = converter(document.getElementById(idA).value);
            var b = converter(document.getElementById(idB).value);
            var resultado;

            switch (operador) {
                case '==': resultado = (a == b); break;
                case '!=': resultado = (a != b); break;
                case '>':  resultado = (a > b);  break;
                case '>=': resultado = (a >= b); break;
                case '<':  resultado = (a < b);  break;
                case '<=': resultado = (a <= b); break;
            }

            alert(resultado ? 'VERDADEIRO' : 'FALSO');
        }
    </script>

</body>
</html>
